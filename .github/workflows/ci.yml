name: ci
on:
  push:
    branches:
      - master 
      - main
  pull_request:
    branches:
      - master
      - main
permissions:
  contents: write

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          # The documentation plugin stack is not yet compatible with Python 3.14.
          python-version: "3.13"

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: "Install dependencies"
        run: uv sync --dev --python 3.13

      - name: "Test collector polling and packaging"
        run: |
          cd collector
          uv sync --no-dev --python 3.13
          uv run python -m unittest discover -s tests
          cd ..
          uv run --python 3.13 scripts/package_pico.py --config collector/src/config.example.json

      - name: "Test storage authentication"
        run: |
          cd storage
          uv sync --no-dev --python 3.13
          PYTHONPATH=src uv run python -m unittest discover -s tests

      - name: "Build documentation"
        run: uv run mkdocs build

      - name: "Deploy Docs"
        if: github.event_name == 'push'
        run: uv run mkdocs gh-deploy --force
