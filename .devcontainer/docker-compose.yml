version: '3.9'

services:
  open-collector:
    init: true
    expose:
      - 8000
    build:
      context: ../
      dockerfile: ./.devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity

  database:
    image: questdb/questdb
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8812:8812"
    volumes:
      - ./data:/var/lib/questdb
    environment:
      - QDB_PG_USER=pguser
      - QDB_PG_PASSWORD=quest
      - QDB_HTTP_USER=node
      - QDB_HTTP_PASSWORD=quest