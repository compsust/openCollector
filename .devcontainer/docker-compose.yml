version: '3.9'

services:
  open-collector:
    init: true
    expose:
      - 8000
    build:
      context: ../
      dockerfile: ./.devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity

  database:
    image: influxdb:latest
    restart: unless-stopped
    expose:
      - 8086
    volumes:
      - ./data:/var/lib/influxdb2
      - ./config:/etc/influxdb2

  memcached:
    image: memcached
    command:
      - --conn-limit=1024
      - --memory-limit=64
      - --threads=4


volumes:
  db_data: