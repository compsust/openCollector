<select id="collector_select" x-model="collector_id" 
        hx-get="/snippets/sensor_select_options" 
        hx-target="#sensor_select_container" 
        hx-vals='{"collector_id": "collector1"}'
        hx-trigger="change"
        class="bg-gray-200 p-2">
    <option value="" disabled>Select a Collector</option>

    {% for option in options %}
        <option value="{{ option.value }}">{{ option.label }}</option>
    {% endfor %}
</select>
