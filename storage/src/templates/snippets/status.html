{% if status == 'Operational' %}
    <div class="w-5 h-5 rounded-2xl border border-black bg-lime-400"></div>
{% elif status == 'Error' %}
    <div class="w-5 h-5 rounded-2xl border border-black bg-red-400"></div>
{% elif status == 'Dropped' %}
    <div class="w-5 h-5 rounded-2xl border border-black bg-amber-400"></div>
{% else %}
    <div class="w-5 h-5 rounded-2xl border border-black bg-white"></div>
{% endif %}
