[project]
name = "collector"
version = "0.1.0"
description = "The component of openCollector which interfaces with sensors and uploads data to the database."
license = "MPL-2.0"
dependencies = ["common", "requests>=2.32.0"]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    "micropython-rp2-pico-stubs>=1.20.0.post5",
    "typing>=3.10.0.0",
]

[tool.uv.sources]
common = { path = "../common" }
