[project]
name = "sfu-compsust-open-collector"
version = "0.1"
requires-python = ">= 3.13"
dependencies = [
    "neoteroi-mkdocs>=1.1.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-include-markdown-plugin>=7.1.5",
    "mkdocs-material>=9.6.9",
    "mkdocstrings-python>=1.16.8",
     "neoteroi-mkdocs>=1.1.0",
    "ruff>=0.8.6",
]

[tool.ruff.lint]
extend-select = ["I"]
exclude = [
    "typings/*"
]
