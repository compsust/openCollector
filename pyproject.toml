[project]
name = "sfu-compsust-open-collector"
version = "0.1"
dependencies = [
    "common",
    "collector",
    "storage",
    "influxdb-client>=1.48.0",
]
requires-python = ">= 3.13"

[tool.uv]
dev-dependencies = [
    "ruff>=0.8.6",
]

[tool.uv.sources]
common = { workspace = true }
collector = { workspace = true }
storage = { workspace = true }

[tool.uv.workspace]
members = ["common", "collector", "storage"]

[tool.ruff.lint]
extend-select = ["I"]
exclude = [
    "typings/*"
]
